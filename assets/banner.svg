<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.0" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.8; }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); }
      50% { transform: translateY(-12px) translateX(8px); }
      100% { transform: translateY(0px) translateX(0px); }
    }
    @keyframes dashLine {
      to { stroke-dashoffset: -40; }
    }
    @keyframes chartFlow {
      0% { stroke-dashoffset: 600; }
      50% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -600; }
    }
    .bg-grid {
      stroke: #1E293B;
      stroke-width: 1;
      opacity: 0.4;
    }
    .particle {
      animation: floatParticle 6s ease-in-out infinite;
    }
    .glow-orb {
      animation: pulseGlow 4s ease-in-out infinite;
    }
    .chart-line {
      stroke-dasharray: 600;
      animation: chartFlow 12s linear infinite;
    }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Ambient Orbs (Background layer) -->
  <circle cx="150" cy="80" r="140" fill="#3B82F6" opacity="0.15" class="glow-orb" filter="url(#glow)" />
  <circle cx="1050" cy="280" r="160" fill="#8B5CF6" opacity="0.15" class="glow-orb" filter="url(#glow)" />
  <circle cx="600" cy="180" r="200" fill="#10B981" opacity="0.08" class="glow-orb" filter="url(#glow)" />

  <!-- Grid Pattern -->
  <g class="bg-grid">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="200" y1="0" x2="200" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="800" y1="0" x2="800" y2="360" />
    <line x1="1000" y1="0" x2="1000" y2="360" />
  </g>

  <!-- Dynamic Trading Market Background Wave / Chart (Stays behind text) -->
  <path d="M 50 280 Q 200 220 350 250 T 650 180 T 950 210 T 1150 130 L 1150 320 L 50 320 Z" fill="url(#chartGrad)" opacity="0.5" />
  <path d="M 50 280 Q 200 220 350 250 T 650 180 T 950 210 T 1150 130" fill="none" stroke="#10B981" stroke-width="3" opacity="0.7" class="chart-line" />

  <!-- Subtle Floating Decorative Particles -->
  <circle cx="220" cy="100" r="4" fill="#38BDF8" class="particle" style="animation-delay: 0s;" />
  <circle cx="980" cy="90" r="5" fill="#F472B6" class="particle" style="animation-delay: 1.5s;" />
  <circle cx="850" cy="270" r="3.5" fill="#FBBF24" class="particle" style="animation-delay: 3s;" />
  <circle cx="120" cy="240" r="4.5" fill="#34D399" class="particle" style="animation-delay: 2s;" />

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="1200" height="6" fill="url(#accentGrad)" />

  <!-- MAIN FOREGROUND TEXT & BADGES (Guaranteed crisp & visible) -->
  <g text-anchor="middle">
    <!-- Category Pill Badge -->
    <rect x="440" y="38" width="320" height="32" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
    <text x="600" y="59" fill="#38BDF8" font-family="Segoe UI, -apple-system, Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">
      ⚡ CURATED CTRM &amp; ETRM ECOSYSTEM
    </text>

    <!-- Main Title -->
    <text x="600" y="140" fill="#FFFFFF" font-family="Segoe UI, -apple-system, Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5" filter="url(#subtleGlow)">
      Awesome Commodity Trading
    </text>
    <text x="600" y="195" fill="url(#goldGrad)" font-family="Segoe UI, -apple-system, Roboto, sans-serif" font-size="40" font-weight="800" letter-spacing="-0.5" filter="url(#subtleGlow)">
      &amp; Risk Management
    </text>

    <!-- Subtitle -->
    <text x="600" y="248" fill="#94A3B8" font-family="Segoe UI, -apple-system, Roboto, sans-serif" font-size="17" font-weight="400">
      Enterprise SaaS Platforms • Open-Source Risk Engines • Derivatives &amp; Physical Logistics Analytics
    </text>

    <!-- Bottom Feature Chips -->
    <g transform="translate(240, 280)">
      <!-- Chip 1 -->
      <rect x="0" y="0" width="220" height="34" rx="8" fill="#1E293B" stroke="#3B82F6" stroke-opacity="0.4" stroke-width="1" />
      <text x="110" y="22" fill="#93C5FD" font-family="Segoe UI, -apple-system, Roboto, sans-serif" font-size="13" font-weight="600">📊 Risk &amp; VaR Models</text>

      <!-- Chip 2 -->
      <rect x="250" y="0" width="220" height="34" rx="8" fill="#1E293B" stroke="#8B5CF6" stroke-opacity="0.4" stroke-width="1" />
      <text x="360" y="22" fill="#C4B5FD" font-family="Segoe UI, -apple-system, Roboto, sans-serif" font-size="13" font-weight="600">🛢️ Energy &amp; Commodities</text>

      <!-- Chip 3 -->
      <rect x="500" y="0" width="220" height="34" rx="8" fill="#1E293B" stroke="#10B981" stroke-opacity="0.4" stroke-width="1" />
      <text x="610" y="22" fill="#6EE7B7" font-family="Segoe UI, -apple-system, Roboto, sans-serif" font-size="13" font-weight="600">📈 Deal &amp; Position Capture</text>
    </g>
  </g>
</svg>
